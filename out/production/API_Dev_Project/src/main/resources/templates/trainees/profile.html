<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Trainee Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .profile-wrapper {
            max-width: 900px;
            margin: 60px auto;
        }

        .profile-header {
            background: linear-gradient(90deg, #111, #1c1c1c);
            color: white;
            padding: 25px;
            border-radius: 12px 12px 0 0;
        }

        .profile-card {
            border-radius: 12px;
            overflow: hidden;
            border: none;
        }

        .profile-body {
            padding: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
        }

        .value {
            font-size: 16px;
            margin-top: 5px;
            color: #111;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .btn-dark-custom {
            background: #111;
            color: white;
        }

        .btn-dark-custom:hover {
            background: #e63946;
            color: white;
        }
    </style>
</head>

<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="profile-wrapper">

    <div class="card profile-card shadow">

        <!-- Header -->
        <div class="profile-header">
            <h2 class="mb-0">Trainee Profile</h2>
            <small>Sparta Academy Management System</small>
        </div>

        <!-- Body -->
        <div class="profile-body">

            <div class="info-grid">

                <div class="info-box">
                    <div class="label">ID</div>
                    <div class="value" th:text="${trainee.traineeId}"></div>
                </div>

                <div class="info-box">
                    <div class="label">Title</div>
                    <div class="value" th:text="${trainee.traineeTitle}"></div>
                </div>

                <div class="info-box">
                    <div class="label">Name</div>
                    <div class="value" th:text="${trainee.traineeName}"></div>
                </div>

                <div class="info-box">
                    <div class="label">Date of Birth</div>
                    <div class="value" th:text="${trainee.traineeDob}"></div>
                </div>

                <div class="info-box" style="grid-column: span 2;">
                    <div class="label">Email</div>
                    <div class="value" th:text="${trainee.traineeEmail}"></div>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="footer-actions">

            <a th:href="@{/trainees}" class="btn btn-secondary">
                Back
            </a>

            <div sec:authorize="hasRole('TRAINER')">
                <a th:href="@{/trainees/{id}/edit(id=${trainee.traineeId})}"
                   class="btn btn-dark-custom">
                    Edit Profile
                </a>
            </div>

        </div>

    </div>

</div>
<script th:src="@{/js/handling.js}"></script>

</body>
</html>
