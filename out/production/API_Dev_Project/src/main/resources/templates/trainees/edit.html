<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Trainee</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="fragments/header :: header(
    'Trainee Management Portal',
    'Edit trainee details')"></div>

<div class="container mt-5">

    <h1 class="mb-4">Edit Trainee</h1>

    <form th:action="@{/trainees/{id}/update(id=${trainee.traineeId})}"
          th:object="${trainee}"
          method="post">

        <input type="hidden"
               th:field="*{traineeId}">

        <div class="mb-3">

            <label class="form-label">Title</label>

            <input type="text"
                   class="form-control"
                   th:field="*{traineeTitle}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Name</label>

            <input type="text"
                   class="form-control"
                   th:field="*{traineeName}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Date of Birth</label>

            <input type="date"
                   class="form-control"
                   th:field="*{traineeDob}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{traineeEmail}"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Update
        </button>

        <a th:href="@{/trainees}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>
    <div class="mt-5">
        <h2>Assigned Courses</h2>
        <div th:if="${trainee.courses.isEmpty()}" class="text-muted">
            No courses assigned.
        </div>
        <ul class="list-group" th:if="${!trainee.courses.isEmpty()}">
            <li class="list-group-item d-flex justify-content-between align-items-center"
                th:each="course : ${trainee.courses}">
                <span th:text="${course.courseName}">Course Name</span>

                <form th:action="@{/trainees/remove}" method="post" style="margin:0">
                    <input type="hidden" th:name="traineeId" th:value="${trainee.traineeId}" />
                    <input type="hidden" th:name="selectedCourseId" th:value="${course.courseId}" />
                    <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                </form>
            </li>
        </ul>
    </div>

</div>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>

</html>
