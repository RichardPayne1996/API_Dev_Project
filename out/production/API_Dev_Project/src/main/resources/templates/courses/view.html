<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/head :: head('View Course')"></head>

<body class="bg-light">

<div th:replace="fragments/header :: header(
    'Course Management Portal',
    'View course details')"></div>
<main>
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h2>Course Details</h2>

        </div>

        <div class="card-body">

            <p>
                <strong>ID:</strong>

                <span th:text="${course.courseId}"></span>
            </p>

            <p>
                <strong>Course Name:</strong>

                <span th:text="${course.courseName}"></span>
            </p>

            <p>
                <strong>Description:</strong>

                <span th:text="${course.description}"></span>
            </p>

        </div>

        <div class="card-footer">

            <a th:href="@{/courses}"
               class="btn btn-secondary">
                Back
            </a>

            <a sec:authorize="hasRole('TRAINER')" th:href="@{/courses/{id}/edit(id=${course.courseId})}"
               class="btn btn-warning">
                Edit
            </a>


        </div>

    </div>

</div>
</main>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>

</html>
