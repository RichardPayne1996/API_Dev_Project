<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head('New Course')"></head>

<body class="bg-light">#

<div th:replace="fragments/header :: header(
    'Course Management Portal',
    'Create new course')"></div>
<main>
<div class="container mt-5">

    <h1>Create New Course</h1>

    <form th:action="@{/courses/save}"
          th:object="${course}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Course Name
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{courseName}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea class="form-control"
                      th:field="*{description}"
                      rows="4"
                      required></textarea>

        </div>

        <button type="submit"
                class="btn btn-success">
            Save
        </button>

        <a th:href="@{/courses}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
</main>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>

</html>
