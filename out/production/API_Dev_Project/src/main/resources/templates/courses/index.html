<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/head :: head('Course Management Portal')"></head>

<body class="bg-light">

<div th:replace="fragments/header :: header(
    'Course Management Portal',
    'Manage and search through courses')"></div>

<main>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>All Courses</h1>

        <a class="btn btn-primary"
           sec:authorize="hasRole('TRAINER')"
           th:href="@{/courses/new}">
            Add Course
        </a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Course Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="c : ${courses}">

            <td th:text="${c.courseId}"></td>

            <td th:text="${c.courseName}"></td>

            <td th:text="${c.description}"></td>

            <td>

                <a class="btn btn-sm btn-info"
                   th:href="@{/courses/{id}(id=${c.courseId})}">
                    View
                </a>

                <span sec:authorize="hasRole('TRAINER')">

        <a class="btn btn-sm btn-warning"
           th:href="@{/courses/{id}/edit(id=${c.courseId})}">
            Edit
        </a>

        <form th:action="@{/courses/{id}/delete(id=${c.courseId})}"
              method="post"
              class="d-inline">

            <button type="submit"
                    class="btn btn-sm btn-danger delete">
                Delete
            </button>

        </form>

    </span>

            </td>

        </tr>

        </tbody>

    </table>

</div>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>

<script th:src="@{/js/handling.js}"></script>

</body>

</html>
