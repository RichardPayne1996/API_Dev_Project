<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head th:replace="fragments/head :: head('Trainee Management Portal')"></head>

<body class="bg-light">

<div th:replace="fragments/header :: header(
    'Trainee Management Portal',
    'Manage and search through trainees')"></div>

<main>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="mb-0">All Trainees</h1>

        <div class="d-flex gap-2">
        <a class="btn btn-primary"
           th:href="@{/trainees/new}" sec:authorize="hasRole('TRAINER')">
            Add Trainee
        </a>

        <a class="btn btn-success"
           sec:authorize="hasRole('TRAINER')"
           th:href="@{/enrollment/trainee/new}">
            Enroll Trainee in Course
        </a>
        </div>
    </div>
    <form th:action="@{/trainees/search}" method="get" class="mb-3">
        <div class="d-flex">
        <input type="text"
               name="name"
               th:value="${searchName}"
               placeholder="Search trainees by name"
               class="form-control me-2" />

        <button type="submit" class="btn btn-primary">
            Search
        </button>
        </div>
    </form>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Email</th>
            <th>Courses</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="t : ${trainees}">

            <td th:text="${t.traineeId}"></td>

            <td th:text="${t.traineeTitle}"></td>

            <td th:text="${t.traineeName}"></td>

            <td th:text="${t.traineeDob}"></td>

            <td th:text="${t.traineeEmail}"></td>

            <td>
                <span th:each="course : ${t.courses}"
                      th:text="${course.courseName} + ' '"></span>
            </td>

            <td sec:authorize="hasRole('TRAINER')">

                <a class="btn btn-sm btn-info"
                   th:href="@{/trainees/{id}(id=${t.traineeId})}">
                    View
                </a>

                <a class="btn btn-sm btn-warning"
                   th:href="@{/trainees/{id}/edit(id=${t.traineeId})}">
                    Edit
                </a>

                <form th:action="@{/trainees/{id}/delete(id=${t.traineeId})}"
                      method="post"
                      class="d-inline">

                    <button type="submit"
                            class="btn btn-sm btn-danger delete">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</main>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>
</html>
