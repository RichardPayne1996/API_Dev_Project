<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">



<body class="bg-light">
<header>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
</head>
<nav class="sparta-animated-bg">

    <h1>Sparta Academy</h1>

    <ul>
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/trainees/view}">Trainees</a></li>
        <li><a th:href="@{/trainers/view}">Trainers</a></li>
        <li><a th:href="@{/courses/view}">Courses</a></li>
    </ul>

</nav>

<section class="hero"><div class="hero-content">
    <h2>Trainee Management Portal</h2>
    <p>Manage and search through trainees</p>
</div></section>
</header>
<main>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>All Trainees</h1>

        <a class="btn btn-primary"
           th:href="@{/trainees/new}">
            Add Trainee
        </a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="t : ${trainees}">

            <td th:text="${t.traineeId}"></td>

            <td th:text="${t.traineeTitle}"></td>

            <td th:text="${t.traineeName}"></td>

            <td th:text="${t.traineeDob}"></td>

            <td th:text="${t.traineeEmail}"></td>

            <td>

                <a class="btn btn-sm btn-info"
                   th:href="@{/trainees/{id}(id=${t.traineeId})}">
                    View
                </a>

                <a class="btn btn-sm btn-warning"
                   th:href="@{/trainees/{id}/edit(id=${t.traineeId})}">
                    Edit
                </a>

                <form th:action="@{/trainees/{id}/delete(id=${t.traineeId})}"
                      method="post"
                      class="d-inline">

                    <button type="submit"
                            class="btn btn-sm btn-danger">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</main>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
</body>

</html>
