<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>All Trainees</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>All Trainees</h1>

        <a class="btn btn-primary"
           sec:authorize="hasRole('TRAINER')"
           th:href="@{/trainees/new}">
            Add Trainee
        </a>

        <a class="btn btn-success mt-2"
           sec:authorize="hasRole('TRAINER')"
           th:href="@{/enrollment/trainee/new}">
            Enroll Trainee in Course
        </a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Email</th>
            <th>Courses</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="t : ${trainees}">

            <td th:text="${t.traineeId}"></td>

            <td th:text="${t.traineeTitle}"></td>

            <td th:text="${t.traineeName}"></td>

            <td th:text="${t.traineeDob}"></td>

            <td th:text="${t.traineeEmail}"></td>

            <td>
                <span th:each="course : ${t.courses}"
                      th:text="${course.courseName} + ' '"></span>
            </td>

            <td>

                <a class="btn btn-sm btn-info"
                   th:href="@{/trainees/{id}(id=${t.traineeId})}">
                    View
                </a>

                <span sec:authorize="hasRole('TRAINER')">

            <a class="btn btn-sm btn-warning"
               th:href="@{/trainees/{id}/edit(id=${t.traineeId})}">
                Edit
            </a>

            <form th:action="@{/trainees/{id}/delete(id=${t.traineeId})}"
                  method="post"
                  class="d-inline">

                <button type="submit"
                        class="btn btn-sm btn-danger">
                    Delete
            </button>

            </form>

            </span>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
