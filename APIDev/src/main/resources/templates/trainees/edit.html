<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Trainee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">

    <h1 class="text-center">Edit Trainee</h1>

    <form th:action="@{/trainees/update/{id}(id=${trainee.id})}"
          th:object="${trainee}"
          method="post"
          class="mt-4">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text"
                   class="form-control"
                   th:field="*{title}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth</label>
            <input type="date"
                   class="form-control"
                   th:field="*{dob}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="text-center">
            <button type="submit"
                    class="btn btn-primary me-2">
                Update
            </button>

            <a th:href="@{/trainees/}"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
