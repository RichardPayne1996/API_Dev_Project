<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head ><title>'View All Trainees</title></head>

<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a class="btn btn-primary" th:href="@{/viewTrainees/new}">Create new Trainee</a>
    </div>
    <form th:action="@{/trainees/search}" method = "get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search by name" required>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Name</th>
            <th>DoB</th>
            <th>Email</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${trainees}">
            <td th:text="${t.traineeID}"></td>
            <td th:text="${t.traineeTitle}"></td>
            <td th:text="${t.traineeName}"></td>
            <td th:text="${t.traineeDoB}"></td>
            <td th:text="${t.traineeEmail}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/trainees/{id}(id=${t.traineeID})}">View</a>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/trainees/{id}/edit(id=${t.traineeID})}">Edit</a>
                <form class="d-inline"
                      th:action="@{/trainees/{id}/delete(id=${t.traineeID})}"
                      method="post"
                      onsubmit="return confirm('Delete this trainee?')">
                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
