<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>New Trainee</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">

    <h1 class="mb-4">Create New Trainee</h1>

    <form th:action="@{/trainees/save}"
          th:object="${trainee}"
          method="post">

        <div class="mb-3">

            <label class="form-label">Title</label>

            <input type="text"
                   class="form-control"
                   th:field="*{traineeTitle}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Name</label>

            <input type="text"
                   class="form-control"
                   th:field="*{traineeName}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Date of Birth</label>

            <input type="date"
                   class="form-control"
                   th:field="*{traineeDob}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{traineeEmail}"
                   required>

        </div>

        <button type="submit"
                class="btn btn-success">
            Save
        </button>

        <a th:href="@{/trainees}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
</body>

</html>
