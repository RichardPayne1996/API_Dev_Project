<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Edit Trainee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


<div class="container mt-5">
    <h1 class="text-center">Edit Trainee</h1>

    <!-- Main Edit Form -->
    <form th:action="@{/trainees/{id}/update(id=${trainee.id})}"
          th:object="${trainee}"
          method="post"
          class="mt-4">

        <!-- ID (read-only + hidden for submission safety) -->
        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control-plaintext text-muted"
                   th:value="*{id}"
                   readonly>
            <input type="hidden" th:field="*{id}">
        </div>

        <!-- Title -->
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text"
                   class="form-control"
                   th:field="*{title}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">DoB</label>
            <input type="text"
                   class="form-control"
                   th:field="*{DoB}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary me-2">
                Save
            </button>

            <a th:href="@{/trainees/}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>

</div>
</body>
</html>
