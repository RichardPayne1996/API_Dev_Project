<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>View All Courses</title>
</head>

<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a class="btn btn-primary" th:href="@{/courses/new}">Create new Courses</a>
    </div>
    <form th:action="@{/courses/search}" method = "get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search by name" required>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Course Name</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.courseName}"></td>
            <td th:text="${c.description}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/courses/{id}(id=${c.id})}">View</a>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/courses/{id}/edit(id=${c.id})}">Edit</a>
                <form class="d-inline"
                      th:action="@{/courses/{id}/delete(id=${c.id})}"
                      method="post"
                      onsubmit="return confirm('Delete this course?')">
                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
