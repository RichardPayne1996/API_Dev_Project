<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Course Details</h1>

    <div class="card shadow-sm p-4">

        <div class="mb-3">
            <h5>Course ID</h5>
            <p th:text="${course.id}"></p>
        </div>

        <div class="mb-3">
            <h5>Course Name</h5>
            <p th:text="${course.courseName}"></p>
        </div>

        <div class="mb-4">
            <h5>Description</h5>
            <p th:text="${course.description}"></p>
        </div>

        <div class="mb-4">

            <h4>Assigned Trainers</h4>

            <ul class="list-group"
                th:if="${not #lists.isEmpty(course.trainers)}">

                <li class="list-group-item"
                    th:each="trainer : ${course.trainers}"
                    th:text="${trainer.username}">
                </li>

            </ul>

            <div class="alert alert-warning mt-2"
                 th:if="${#lists.isEmpty(course.trainers)}">

                No trainers assigned to this course.

            </div>

        </div>

        <div class="mb-4">

            <h4>Enrolled Trainees</h4>

            <ul class="list-group"
                th:if="${not #sets.isEmpty(course.trainees)}">

                <li class="list-group-item"
                    th:each="trainee : ${course.trainees}"
                    th:text="${trainee.username}">
                </li>

            </ul>

            <div class="alert alert-warning mt-2"
                 th:if="${#sets.isEmpty(course.trainees)}">

                No trainees enrolled in this course.

            </div>

        </div>

        <div class="text-center">

            <!-- Edit -->
            <a th:href="@{/courses/{id}/edit(id=${course.id})}"
               class="btn btn-primary me-2">

                Edit Course

            </a>

            <a th:href="@{/courses}"
               class="btn btn-secondary">

                Back to Courses

            </a>

        </div>

    </div>

</div>

</body>
</html>
