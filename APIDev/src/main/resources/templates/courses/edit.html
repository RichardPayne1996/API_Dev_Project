<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Course</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1>Edit Course</h1>

    <form th:action="@{/courses/{id}/update(id=${course.courseId})}"
          th:object="${course}"
          method="post">

        <input type="hidden"
               th:field="*{courseId}">

        <div class="mb-3">

            <label class="form-label">
                Course Name
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{courseName}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea class="form-control"
                      th:field="*{description}"
                      rows="4"
                      required></textarea>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Update
        </button>

        <a th:href="@{/courses}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>

</html>
