<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Edit Course</h1>

    <!-- Edit Course Form -->
    <form th:action="@{/courses/{id}/update(id=${course.id})}"
          th:object="${course}"
          method="post"
          class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label for="id" class="form-label">Course ID</label>

            <input type="text"
                   id="id"
                   th:field="*{id}"
                   class="form-control"
                   readonly>
        </div>

        <div class="mb-3">
            <label for="courseName" class="form-label">
                Course Name
            </label>

            <input type="text"
                   id="courseName"
                   th:field="*{courseName}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">
                Description
            </label>

            <textarea id="description"
                      th:field="*{description}"
                      class="form-control"
                      rows="4"
                      required></textarea>
        </div>

        <div class="text-center">

            <!-- Save -->
            <button type="submit"
                    class="btn btn-primary me-2">
                Save Changes
            </button>

            <form th:action="@{/courses/{id}/delete(id=${course.id})}"
                  method="post"
                  class="d-inline">

                <button type="submit"
                        class="btn btn-danger me-2"
                        onclick="return confirm('Are you sure you want to delete this course?')">
                    Delete
                </button>
            </form>
            <a th:href="@{/courses}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
