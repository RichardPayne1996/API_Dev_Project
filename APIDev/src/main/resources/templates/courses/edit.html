<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head('Edit Course')"></head>

<body class="bg-light">

<div th:replace="fragments/header :: header(
    'Course Management Portal',
    'Edit course details')"></div>
<main>
<div class="container mt-5">

    <h1>Edit Course</h1>

    <form th:action="@{/courses/{id}/update(id=${course.courseId})}"
          th:object="${course}"
          method="post">

        <input type="hidden"
               th:field="*{courseId}">

        <div class="mb-3">

            <label class="form-label">
                Course Name
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{courseName}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea class="form-control"
                      th:field="*{description}"
                      rows="4"
                      required></textarea>

        </div>
        <div class="mb-3">

            <label class="form-label">
                Duration (weeks)
            </label>

            <input type="number"
                   class="form-control"
                   th:field="*{duration}"
                   min="1"
                   max="52"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Update
        </button>

        <a th:href="@{/courses}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
</main>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>

</html>
