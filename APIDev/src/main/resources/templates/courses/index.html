<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>All Courses</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>All Courses</h1>

        <a class="btn btn-primary"
           sec:authorize="hasRole('TRAINER')"
           th:href="@{/courses/new}">
            Add Course
        </a>

    </div>

    <table class="table table-bordered table-hover bg-white">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Course Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="c : ${courses}">

            <td th:text="${c.courseId}"></td>

            <td th:text="${c.courseName}"></td>

            <td th:text="${c.description}"></td>

            <td>

                <a class="btn btn-sm btn-info"
                   th:href="@{/courses/{id}(id=${c.courseId})}">
                    View
                </a>

                <span sec:authorize="hasRole('TRAINER')">

        <a class="btn btn-sm btn-warning"
           th:href="@{/courses/{id}/edit(id=${c.courseId})}">
            Edit
        </a>

        <form th:action="@{/courses/{id}/delete(id=${c.courseId})}"
              method="post"
              class="d-inline">

            <button type="submit"
                    class="btn btn-sm btn-danger">
                Delete
            </button>

        </form>

    </span>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
