<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head('Trainee Management Portal')"></head>

<body class="bg-light">

<div th:replace="fragments/header :: header('Trainee Management Portal', 'Assign trainee to a course')"></div>
<main>
<div class="container mt-5">

    <h1 class="mb-4">Enroll Trainee in a Course</h1>

    <form th:action="@{/enrollment/trainee/save}" th:object="${traineeDTO}" method="post">

        <div class="mb-3">
            <label class="form-label">Select Trainee</label>
            <select class="form-select" th:field="*{traineeId}" required>
                <option value="" disabled selected>-- Choose a Trainee --</option>
                <option th:each="trainee : ${trainees}"
                        th:value="${trainee.traineeId}"
                        th:text="${trainee.traineeName}">Trainee Name</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Course</label>
            <select class="form-select" name="courseId" required>
                <option value="" disabled selected>-- Choose a Course --</option>
                <option th:each="course : ${courses}"
                        th:value="${course.courseId}"
                        th:text="${course.courseName}">Course Name</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Enroll</button>
        <a th:href="@{/courses}" class="btn btn-secondary">Cancel</a>

    </form>
</div>
</main>
<footer class="sparta-animated-bg">
    Sparta Academy Management System
</footer>
<script th:src="@{/js/handling.js}"></script>
</body>
</html>
