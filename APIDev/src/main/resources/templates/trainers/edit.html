<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Trainer</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Edit Trainer</h1>

    <form th:action="@{/trainers/{id}/update(id=${trainer.trainerId})}"
          th:object="${trainer}"
          method="post">

        <input type="hidden"
               th:field="*{trainerId}">

        <div class="mb-3">

            <label class="form-label">Title</label>

            <input type="text"
                   class="form-control"
                   th:field="*{trainerTitle}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Name</label>

            <input type="text"
                   class="form-control"
                   th:field="*{trainerName}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Date of Birth</label>

            <input type="date"
                   class="form-control"
                   th:field="*{trainerDob}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{trainerEmail}"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Update
        </button>

        <a th:href="@{/trainers}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
